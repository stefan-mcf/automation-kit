name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src

      - name: Validate pattern library
        run: python -m auto_kit.cli validate-all

      - name: Build image
        run: docker build -t automation-kit .

      - name: Validate patterns in container
        run: docker run --rm automation-kit validate-all

      - name: Validate Docker Compose file
        run: docker compose config
