services:
  automation-kit-api:
    build: .
    image: automation-kit:local
    container_name: automation-kit-api
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - auto_kit.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      - AUTO_KIT_USE_LIVE_SERVICES=false
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
