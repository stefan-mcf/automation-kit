[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-kit"
version = "0.1.0"
description = "Low-code automation pattern library with tested Python equivalents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Stefan"},
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "mcp>=1.0.0",
]

[project.scripts]
auto-kit = "auto_kit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
    "pillow>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["auto_kit*"]

[tool.setuptools.package-data]
auto_kit = ["registry/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "patterns"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
